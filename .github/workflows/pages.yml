name: Deploy Mobile Briefing PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir -p site
          curl -fL 'https://drive.google.com/uc?export=download&id=1XNdezdj6OVyD0w-XZfrv9bfhrJXjfXcd' -o site/index.html
          curl -fL 'https://drive.google.com/uc?export=download&id=1Pwbcjd9_ztODM7ifDaMv7WFODwLRk9xj' -o site/style.css
          curl -fL 'https://drive.google.com/uc?export=download&id=1SzmMhct03A2ZvDzRGzGVtcPE_mqP4Gbi' -o site/app.js
          curl -fL 'https://drive.google.com/uc?export=download&id=16U14kBe1frZycAdXQmeSdcOwnAVTzAoa' -o site/data.json
          curl -fL 'https://drive.google.com/uc?export=download&id=1b49LQIRSWwxE9ondwBBfgwF_OWkHndyY' -o site/manifest.webmanifest
          curl -fL 'https://drive.google.com/uc?export=download&id=17SsCYszwrHkNIBcwxtb9hPxd_ClmXuRE' -o site/service-worker.js
          curl -fL 'https://drive.google.com/uc?export=download&id=1q-5Gylur6VF8L03jCEroicUaSGyH7quV' -o site/icon.svg
          touch site/.nojekyll
          test -s site/index.html
          test -s site/style.css
          test -s site/app.js
          test -s site/data.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
