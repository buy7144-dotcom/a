name: Deploy Mobile Briefing PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir -p site
          curl -fL 'https://drive.google.com/uc?export=download&id=1kJuQmgxj4Hr3KUwrQlwFwp9klDBTpaKn' -o site/index.html
          touch site/.nojekyll
          test -s site/index.html
          grep -q 'Copilot Custom Skills' site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
